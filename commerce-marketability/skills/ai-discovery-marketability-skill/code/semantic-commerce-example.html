<head><link rel="canonical" href="https://example.com/products/example-product"><meta name="description" content="Example semantic commerce page"></head>
<main>
  <article itemscope itemtype="https://schema.org/Product">
    <h1 itemprop="name">Example Product</h1>
    <p><strong>Material:</strong> <span itemprop="material">100% linen</span></p>
    <p><strong>Availability:</strong> Made to order</p>
    <label for="size">Size</label>
    <select id="size" name="size">
      <option value="m">M</option>
      <option value="l">L</option>
    </select>
    <button type="button" aria-label="Add Example Product to cart">Add to cart</button>
  </article>
</main>
